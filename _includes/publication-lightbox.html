{% comment %}
  Click-to-enlarge for publication teaser figures. Without JS the thumbnail link
  still opens the image file directly.
{% endcomment %}
<div class="pub-lightbox" id="pub-lightbox" hidden>
  <button class="pub-lightbox-close" type="button" aria-label="Close">&times;</button>
  <figure>
    <img src="" alt="">
    <figcaption></figcaption>
  </figure>
</div>

<script>
(function () {
  var box = document.getElementById('pub-lightbox');
  if (!box) return;
  var img = box.querySelector('img');
  var caption = box.querySelector('figcaption');
  var lastFocused = null;

  function open(link) {
    lastFocused = link;
    img.src = link.getAttribute('href');
    img.alt = link.querySelector('img') ? link.querySelector('img').alt : '';
    caption.textContent = link.getAttribute('data-caption') || '';
    box.hidden = false;
    document.body.classList.add('pub-lightbox-open');
    box.querySelector('.pub-lightbox-close').focus();
  }

  function close() {
    box.hidden = true;
    img.src = '';
    document.body.classList.remove('pub-lightbox-open');
    if (lastFocused) lastFocused.focus();
  }

  document.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('.pub-thumb-link') : null;
    if (link) {
      e.preventDefault();
      open(link);
      return;
    }
    if (!box.hidden && (e.target === box || e.target.closest('.pub-lightbox-close'))) {
      close();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !box.hidden) close();
  });
})();
</script>
